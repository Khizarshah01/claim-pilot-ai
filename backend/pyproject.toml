[project]
name = "claimpilot-backend"
version = "0.1.0"
description = "ClaimPilot agentic claim adjudication API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "langgraph>=0.2.60",
  "anthropic>=0.70",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
